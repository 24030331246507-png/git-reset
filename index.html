</head>
<body>

    <h1>Git Reset</h1>

    <p>Git reset is used to move the current branch to a previous commit.</p>

    <h2>Git Reset Command</h2>

    <p>git reset HEAD~1</p>

    <h2>Uses</h2>
    <p>1. Undo the last commit.</p>
    <p>2. Unstage files.</p>
    <p>3. Manage commit history.</p>

</body>
</html>
